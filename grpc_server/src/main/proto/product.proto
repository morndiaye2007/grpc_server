syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.groupeisi.grpc.proto";
option java_outer_classname = "ProductProto";

package product;

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (ProductDto);
  rpc GetProductById (ProductIdRequest) returns (ProductDto);
  rpc GetAllProducts (EmptyRequest) returns (ProductListResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductDto);
  rpc DeleteProduct (ProductIdRequest) returns (DeleteProductResponse);
}

message EmptyRequest {}

message ProductIdRequest {
  int64 id = 1;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 quantity = 4;
}

message UpdateProductRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 quantity = 5;
}

message ProductDto {
  int64 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 quantity = 5;
}

message ProductListResponse {
  repeated ProductDto products = 1;
}

message DeleteProductResponse {
  bool success = 1;
  string message = 2;
}
